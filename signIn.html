<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Родовід — Увійти</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="signIn.css">
</head>

<body>

<nav>
  <a href="main.html" class="logo">Родо<span>від</span></a>
  <a href="main.html" class="back-link">← Повернутись</a>
</nav>

<main>
  <div class="card">

    <div class="tabs">
      <button class="tab active" id="tabSignin">
        Увійти
      </button>

      <button class="tab" id="tabRegister">
        Реєстрація
      </button>
    </div>

    <!-- SIGN IN -->
    <div class="form-body" id="signinForm">

      <div class="form-title">
        З поверненням 👋
      </div>

      <div class="form-sub">
        Увійдіть, щоб продовжити роботу зі своїм деревом
      </div>

      <div class="error-banner" id="siError"></div>

      <div class="input-group">
        <label>Електронна пошта</label>

        <div class="input-wrap">
          <span class="icon">✉️</span>

          <input
            type="email"
            id="siEmail"
            placeholder="name@example.com"
          />
        </div>

        <div class="field-error" id="siEmailErr">
          Введіть коректну адресу пошти
        </div>
      </div>

      <div class="input-group">
        <label>Пароль</label>

        <div class="input-wrap">
          <span class="icon">🔒</span>

          <input
            type="password"
            id="siPass"
            placeholder="••••••••"
          />

          <button
            class="show-pass"
            type="button"
            onclick="togglePass('siPass', this)"
          >
            👁
          </button>
        </div>

        <div class="field-error" id="siPassErr">
          Пароль не може бути порожнім
        </div>
      </div>

      <a href="#" class="forgot" id="forgotBtnLink">
        Забули пароль?
      </a>

      <button class="btn-main" id="signinBtn">
        Увійти
      </button>

      <div class="divider">або</div>

      <button class="btn-social" id="googleLoginBtn">
        Увійти через Google
      </button>
    </div>

    <!-- REGISTER -->
    <div
      class="form-body"
      id="registerForm"
      style="display:none"
    >

      <div class="form-title">
        Створити акаунт 🌱
      </div>

      <div class="form-sub">
        Почніть будувати своє сімейне дерево вже сьогодні
      </div>

      <div class="error-banner" id="regError"></div>

      <div class="input-group">
        <label>Ім'я та прізвище</label>

        <div class="input-wrap">
          <span class="icon">👤</span>

          <input
            type="text"
            id="regName"
            placeholder="Іван Петренко"
          />
        </div>
      </div>

      <div class="input-group">
        <label>Електронна пошта</label>

        <div class="input-wrap">
          <span class="icon">✉️</span>

          <input
            type="email"
            id="regEmail"
            placeholder="name@example.com"
          />
        </div>
      </div>

      <div class="input-group">
        <label>Пароль</label>

        <div class="input-wrap">
          <span class="icon">🔒</span>

          <input
            type="password"
            id="regPass"
            placeholder="Мінімум 6 символів"
          />

          <button
            class="show-pass"
            type="button"
            onclick="togglePass('regPass', this)"
          >
            👁
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>Підтвердіть пароль</label>

        <div class="input-wrap">
          <span class="icon">🔒</span>

          <input
            type="password"
            id="regPass2"
            placeholder="Повторіть пароль"
          />
        </div>
      </div>

      <button class="btn-main" id="registerBtn">
        Зареєструватись
      </button>

      <div class="divider">або</div>

      <button class="btn-social" id="googleRegisterBtn">
        Зареєструватись через Google
      </button>
    </div>

  </div>
</main>

<script type="module" src="signIn.js"></script>

</body>
</html>
