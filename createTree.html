<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Родовід — Редактор дерева</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="createTree.css">

  <!-- Тема застосовується ДО рендеру, щоб не було мерехтіння -->
  <script>
    (function() {
      var themes = {
        forest: {'--bg':'#f5f0e8','--bg2':'#ede6d6','--green':'#3a6b4a','--green-light':'#5a8f6a','--green-pale':'#d4e8da','--brown':'#7a5c3a','--text':'#2c2218','--muted':'#7a6a55','--border':'#d8cdb8','--white':'#fff'},
        ocean:  {'--bg':'#e8f2f8','--bg2':'#d8eaf4','--green':'#2a6080','--green-light':'#3a80a8','--green-pale':'#c8e0ee','--brown':'#3a6878','--text':'#0f2a38','--muted':'#4a7088','--border':'#b8d4e4','--white':'#fff'},
        autumn: {'--bg':'#fdf3e8','--bg2':'#f5e6d0','--green':'#a04020','--green-light':'#c05030','--green-pale':'#fde0cc','--brown':'#8a5020','--text':'#2a1408','--muted':'#8a5a3a','--border':'#e0c8a8','--white':'#fff'},
        night:  {'--bg':'#1a1f2e','--bg2':'#141824','--green':'#4a7acf','--green-light':'#6a9aef','--green-pale':'#1e2d4a','--brown':'#7a8aaa','--text':'#e0e8f8','--muted':'#8090b0','--border':'#2a3550','--white':'#1e2438'},
        rose:   {'--bg':'#fdf0f0','--bg2':'#f5e2e2','--green':'#a04060','--green-light':'#c05070','--green-pale':'#fde0e8','--brown':'#8a4050','--text':'#280a14','--muted':'#8a4a58','--border':'#e0c0c8','--white':'#fff'},
        sand:   {'--bg':'#f5f0e0','--bg2':'#ede4cc','--green':'#7a6030','--green-light':'#9a7840','--green-pale':'#e8dfc0','--brown':'#6a5028','--text':'#28200c','--muted':'#7a6840','--border':'#d8c898','--white':'#fff'},
      };
      var t = localStorage.getItem('rodo-theme');
      if (t && themes[t]) {
        var vars = themes[t];
        for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
      }
    })();
  </script>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="main.html" class="logo">Родо<span>від</span></a>
  <div class="topbar-center">
    <input class="tree-name" value="Моє сімейне дерево" id="treeName" spellcheck="false"/>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-outline btn-sm" id="btnOpenModal">➕ Додати людину</button>
    <button class="btn btn-primary btn-sm" id="saveBtnMain">💾 Зберегти</button>
  </div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-title">🌿 Учасники дерева</div>
      <button class="btn btn-outline" style="width:100%;margin-bottom:12px" id="btnOpenModal2">+ Нова людина</button>
      <div class="person-list" id="personList"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">🔗 Зв'язки</div>
      <div class="conn-row">
        <select id="connFrom"></select>
        <span style="font-size:.8rem;color:var(--muted)">→</span>
        <select id="connTo"></select>
      </div>
      <div class="input-group">
        <label>Тип зв'язку</label>
        <select id="connType">
          <option value="parent">Батько/Мати</option>
          <option value="child">Дитина</option>
          <option value="partner">Партнер</option>
          <option value="sibling">Брат/Сестра</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%" id="btnAddConn">Додати зв'язок</button>
      <div class="connection-list" id="connectionList" style="margin-top:12px"></div>
    </div>

    <div class="sidebar-section">
      <div class="hint">💡 Перетягуйте картки на полотні. Виділіть людину кліком — зв'язки підсвітяться.</div>
    </div>

  </aside>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvasWrap">
    <svg id="svgLines" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible"></svg>
    <div id="canvas">
      <div class="empty-hint" id="emptyHint">
        <div class="big">🌳</div>
        <p>Додайте першого члена родини</p>
      </div>
    </div>
    <div class="zoom-controls">
      <div class="zoom-btn" id="btnZoomIn">+</div>
      <div class="zoom-btn" id="btnZoomOut">−</div>
      <div class="zoom-btn" id="btnZoomReset">⌂</div>
    </div>
  </div>
</div>

<!-- ADD PERSON MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Нова людина</h2>
    <div class="input-group">
      <label>Ім'я *</label>
      <input type="text" id="mName" placeholder="Іван Петренко"/>
    </div>
    <div class="input-group">
      <label>Рік народження</label>
      <input type="text" id="mBirth" placeholder="1945"/>
    </div>
    <div class="input-group">
      <label>Рік смерті (якщо є)</label>
      <input type="text" id="mDeath" placeholder="2010"/>
    </div>
    <div class="input-group">
      <label>Стать</label>
      <select id="mGender">
        <option value="m">Чоловік</option>
        <option value="f">Жінка</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCloseModal">Скасувати</button>
      <button class="btn btn-primary" id="btnAddPerson">Додати</button>
    </div>
  </div>
</div>

<!-- Головний скрипт як ES-модуль -->
<script type="module" src="createTree.js"></script>

</body>
</html>
